name: build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'examples/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -x src/bin/conveior src/bin/entrypoint.sh src/bin/backup.sh src/lib/*.sh tests/smoke.sh tests/stubs/*
      - name: smoke test (stubbed kubectl/mysql/rclone)
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          bash tests/smoke.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            lukaspastva/${{ github.event.repository.name }}:${{ github.sha }}
            lukaspastva/${{ github.event.repository.name }}:latest
